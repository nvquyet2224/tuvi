<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="google" content="notranslate">
    <meta name="robots" content="index, follow">
    <meta name="author" content="Tuvi's">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="format-detection" content="telephone=no">
    <title>Tuvi's | Chi Tiết Sản Phẩm Giày Chính Hãng</title>
    <meta name="description" content="Xem chi tiết sản phẩm giày Tuvi's – thiết kế hiện đại, chất liệu cao cấp, đa dạng màu sắc và kích thước. Mua ngay tại Tuvi's!">
    <meta name="keywords" content="chi tiết giày, mua giày Tuvi's, sản phẩm giày, giày chính hãng">
    <meta name="theme-color" content="#fff">
    <meta property="og:title" content="Tuvi's | Chi Tiết Sản Phẩm Giày Chính Hãng">
    <meta property="og:description" content="Xem chi tiết sản phẩm giày Tuvi's – thiết kế hiện đại, chất liệu cao cấp, đa dạng màu sắc và kích thước. Mua ngay tại Tuvi's!">
    <meta property="og:type" content="product">
    <meta property="og:url" content="https://tuvis.vn/product-detail.html">
    <meta property="og:image" content="https://tuvis.vn/images/thumbnail.jpg">
    <meta property="og:site_name" content="Tuvi's">
    <link rel="canonical" href="https://tuvis.vn/product-detail.html">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Tuvi's">
    <link rel="icon" href="images/favicon.png">

    <!-- JSON-LD: BreadcrumbList -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [
        {"@type": "ListItem", "position": 1, "name": "Trang chủ", "item": "https://tuvis.vn/"},
        {"@type": "ListItem", "position": 2, "name": "Sản phẩm", "item": "https://tuvis.vn/product-detail.html"}
      ]
    }
    </script>

    <!-- JSON-LD: Product -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Product",
      "name": "Giày Tuvi's",
      "image": "https://tuvis.vn/images/thumbnail.jpg",
      "brand": {
        "@type": "Brand",
        "name": "Tuvi's"
      },
      "offers": {
        "@type": "Offer",
        "priceCurrency": "VND",
        "availability": "https://schema.org/InStock",
        "seller": {
          "@type": "Organization",
          "name": "Tuvi's"
        }
      }
    }
    </script>

    <link href="css/cmp_reset.css" rel="preload stylesheet" as="style">
    <link href="css/cmp_critical.css" rel="preload stylesheet" as="style">
    <link href="css/cmp_header.css" rel="preload stylesheet" as="style">
    <link href="css/cmp_common.css" rel="preload stylesheet" as="style">
    <link href="css/cmp_swiper.css" rel="preload stylesheet" as="style">
    <link href="css/cmp_product_detail.css" rel="preload stylesheet" as="style">
    <link href="css/cmp_footer.css" rel="preload stylesheet" as="style">
</head>

<body data-page="product-detail">
    <div class="page">
        <%= htmlWebpackPlugin.options.svg %>
        <%= htmlWebpackPlugin.options.header %>
        <div class="main">
            <%= htmlWebpackPlugin.options.product_detail %>
        </div>
        <%= htmlWebpackPlugin.options.footer %>
    </div>
    <script defer src="js/common.js"></script>
    <script defer src="js/swiper-bundle.js"></script>
    <script defer src="js/index_main.js"></script>
    <%= htmlWebpackPlugin.options.preload %>
</body>

</html>
