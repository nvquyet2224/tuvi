<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="google" content="notranslate">
    <meta name="robots" content="index, follow">
    <meta name="author" content="Tuvi's">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="format-detection" content="telephone=no">
    <title>Tuvi's | Blog Detail – Bài Viết Thời Trang</title>
    <meta name="description" content="Đọc bài viết chi tiết từ blog Tuvi's – nội dung về xu hướng thời trang, phong cách sống và tips phối đồ cho mọi dịp.">
    <meta name="keywords" content="blog thời trang, bài viết Tuvi's, xu hướng giày, tips phong cách">
    <meta name="theme-color" content="#fff">
    <meta property="og:title" content="Tuvi's | Blog Detail – Bài Viết Thời Trang">
    <meta property="og:description" content="Đọc bài viết chi tiết từ blog Tuvi's – nội dung về xu hướng thời trang, phong cách sống và tips phối đồ cho mọi dịp.">
    <meta property="og:type" content="article">
    <meta property="og:url" content="https://tuvis.vn/block-detail.html">
    <meta property="og:image" content="https://tuvis.vn/images/thumbnail.jpg">
    <meta property="og:site_name" content="Tuvi's">
    <link rel="canonical" href="https://tuvis.vn/block-detail.html">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Tuvi's">
    <link rel="icon" href="images/favicon.png">

    <!-- JSON-LD: BreadcrumbList -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [
        {"@type": "ListItem", "position": 1, "name": "Trang chủ", "item": "https://tuvis.vn/"},
        {"@type": "ListItem", "position": 2, "name": "Blog", "item": "https://tuvis.vn/blogs.html"},
        {"@type": "ListItem", "position": 3, "name": "Bài Viết", "item": "https://tuvis.vn/block-detail.html"}
      ]
    }
    </script>

    <link href="css/cmp_reset.css" rel="preload stylesheet" as="style">
    <link href="css/cmp_critical.css" rel="preload stylesheet" as="style">
    <link href="css/cmp_header.css" rel="preload stylesheet" as="style">
    <link href="css/cmp_common.css" rel="preload stylesheet" as="style">
    <link href="css/cmp_swiper.css" rel="preload stylesheet" as="style">
    <link href="css/cmp_sub_banner.css" rel="preload stylesheet" as="style">
    <link href="css/cmp_block_detail.css" rel="preload stylesheet" as="style">
    <link href="css/cmp_footer.css" rel="preload stylesheet" as="style">
</head>

<body data-page="block-detail">
    <div class="page">
        <%= htmlWebpackPlugin.options.svg %>
        <%= htmlWebpackPlugin.options.header %>
        <div class="main">
            <%= htmlWebpackPlugin.options.sub_banner %>
            <%= htmlWebpackPlugin.options.block_detail %>
            <%= htmlWebpackPlugin.options.related_blogs %>
        </div>
        <%= htmlWebpackPlugin.options.footer %>
    </div>
    <script defer src="js/common.js"></script>
    <script defer src="js/jquery.js"></script>
    <script defer src="js/jquery-ui.js"></script>
    <script defer src="js/swiper-bundle.js"></script>
    <script defer src="js/index_main.js"></script>
    <script defer src="none/cmp_block_detail.js"></script>
    <%= htmlWebpackPlugin.options.preload %>
</body>

</html>
